name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint and tests
    # Standard GitHub-hosted runners are free only while this repository is public.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FILMAGENT_SETTINGS_SOURCE_MODE: environment
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install ".[dev]"
      - name: Lint Python
        run: python -m ruff check app tests
      - name: Run isolated Python tests
        run: |
          mkdir -p "$RUNNER_TEMP/python-home"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/python-home" \
            FILMAGENT_SETTINGS_SOURCE_MODE=environment \
            python -m pytest

  cloud:
    name: Cloud tests and dry-run build
    # Standard GitHub-hosted runners are free only while this repository is public.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloud
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run isolated cloud tests
        run: |
          mkdir -p "$RUNNER_TEMP/cloud-home"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/cloud-home" CI=true npm test
      - name: Check JavaScript syntax
        run: npm run check
      - name: Build Worker without deploying or authenticating
        run: |
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/cloud-home" \
            XDG_CONFIG_HOME="$RUNNER_TEMP/cloud-home/.config" CI=true \
            WRANGLER_SEND_METRICS=false WRANGLER_SEND_ERROR_REPORTS=false \
            node node_modules/wrangler/bin/wrangler.js deploy --dry-run \
              --outdir "$RUNNER_TEMP/worker-dry-run"

  browser:
    name: Chromium user-flow tests
    # Never move this job to a paid larger runner or run it in a private repository.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloud
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install official Chromium and operating-system dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/browser-home"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/browser-home" CI=true \
            npx --no-install playwright install --with-deps chromium
      - name: Run isolated browser tests with synthetic data and mocked providers
        # Chromium's POSIX filename conversion needs a UTF-8 process locale.
        # Browser UI locale alone does not preserve Unicode download names.
        run: |
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/browser-home" CI=true \
            LANG=C.UTF-8 LC_ALL=C.UTF-8 npm run test:browser
      - name: Upload only clean synthetic demo screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-demo-screenshots
          path: |
            cloud/browser-artifacts/demo-desktop.png
            cloud/browser-artifacts/demo-mobile.png
          retention-days: 1
          if-no-files-found: warn
          include-hidden-files: false
